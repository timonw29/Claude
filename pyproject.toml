[project]
name = "moni"
version = "0.1.0"
description = "Moni - ein persönlicher CLI-Assistent auf Basis der Claude API"
requires-python = ">=3.9"
dependencies = [
    "anthropic>=0.68.0",
]

[project.optional-dependencies]
voice = ["SpeechRecognition>=3.10", "pyttsx3>=2.90", "PyAudio>=0.2.14"]

[project.scripts]
moni = "moni.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
