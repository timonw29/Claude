# In /etc/nginx/sites-available/ als eigene Datei anlegen (z. B. moni.conf),
# dann per Symlink in sites-enabled aktivieren. Certbot kann danach das
# HTTPS-Zertifikat für diesen server_block ergänzen
# (certbot --nginx -d moni.myjarvis-ai.de).

server {
    listen 80;
    server_name moni.myjarvis-ai.de;

    location / {
        # Fall B: Moni-Container mit "127.0.0.1:8010:8010" gemappt, nginx
        # läuft direkt auf dem Host:
        proxy_pass http://127.0.0.1:8010;

        # Fall A (nginx läuft selbst als Container im selben Docker-Netzwerk):
        # proxy_pass http://moni:8010;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
