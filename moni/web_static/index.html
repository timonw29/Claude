<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Moni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/moni-core.js"></script>
<style>
  :root {
    color-scheme: dark;
    --bg: #12131d;
    --tile-bg: #1b1d2b;
    --tile-border: #292b31;
    --border-strong: #3f424d;
    --border-dim: #595d6c;
    --text: #e9e9ed;
    --text-dim: #9397ab;
    --text-weak: #75798c;
    --accent: #9184d9;
    --accent-light: #b5abfc;
    --accent-text: #d2cefd;
    --accent-brightest: #e7e5fe;
    --accent-deep1: #5d5294;
    --accent-deep2: #796cbf;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font: 400 13px/1.4 'Inter', -apple-system, sans-serif;
    position: relative; overflow: hidden;
  }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .overlay-grid, .overlay-glow { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .overlay-grid {
    background-image:
      linear-gradient(rgba(145,132,217,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(145,132,217,.05) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  .overlay-glow {
    height: 280px;
    background: radial-gradient(60% 100% at 26% 0%, rgba(145,132,217,.16), transparent 70%);
  }

  /* ---- Topbar ---- */
  #topbar {
    position: relative; z-index: 1; height: 60px; padding: 0 26px;
    display: flex; align-items: center; gap: 22px; flex: 0 0 auto;
  }
  .wordmark { font: 500 17px/1 'Inter'; letter-spacing: -.01em; color: var(--text); }
  #topbar .datetime { font: 400 11px 'IBM Plex Mono'; color: var(--text-weak); }
  #topbar .spacer { flex: 1; }
  #topbar .stats { display: flex; gap: 20px; font: 400 10px 'IBM Plex Mono'; color: var(--text-weak); align-items: center; }
  #topbar .stats b { color: var(--accent-text); font-weight: 400; }
  #topbar .online { color: var(--accent-light); }
  #topbar a.session-link { color: var(--text-weak); text-decoration: none; font: 400 10px 'IBM Plex Mono'; }
  #topbar a.session-link:active { color: var(--accent-text); }
  #edit-toggle {
    font: 500 11px 'Inter'; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--accent);
    background: transparent; color: var(--accent-text); cursor: pointer;
  }
  #edit-toggle:active, #edit-toggle:hover { background: rgba(145,132,217,.16); }

  /* ---- Edit bar ---- */
  #edit-bar { position: relative; z-index: 1; padding: 0 26px 10px; display: none; align-items: center; gap: 8px; flex-wrap: wrap; }
  #edit-bar.show { display: flex; }
  #edit-bar .label { font: 400 10px 'IBM Plex Mono'; color: var(--text-weak); }
  .chip-hidden {
    padding: 7px 11px; border-radius: 8px; border: 1px dashed var(--border-dim); background: transparent;
    color: var(--text-dim); font: 400 11px 'Inter'; cursor: pointer;
  }
  .chip-hidden:hover { border-color: var(--accent); color: var(--accent-text); }

  /* ---- Grid ---- */
  #grid {
    position: relative; z-index: 1; flex: 1; min-height: 0;
    display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: 1.5fr 1fr 1fr;
    grid-auto-flow: dense; gap: 12px; padding: 0 26px 12px; overflow: hidden;
  }

  /* ---- Kern tile ---- */
  #kern-tile {
    grid-column: span 2; grid-row: span 2; border-radius: 10px; overflow: hidden; position: relative;
    background: linear-gradient(160deg, #20243b, #14151f 72%);
    box-shadow: 0 0 0 1px var(--border-strong);
  }
  #kern-tile moni-core { position: absolute; inset: 0; }
  .kern-overlay { position: absolute; inset: 0; pointer-events: none; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; }
  .kern-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .kern-kicker { font: 500 10px 'IBM Plex Mono'; letter-spacing: .12em; text-transform: uppercase; color: #9397ab; }
  .kern-title { font: 500 34px/1.15 'Inter'; letter-spacing: -.025em; color: var(--text); margin-top: 4px; }
  .kern-meta { text-align: right; font: 400 10px/1.9 'IBM Plex Mono'; color: var(--text-weak); }
  .kern-meta .hl { color: var(--accent-light); }
  .kern-bottom { display: flex; align-items: center; gap: 12px; }
  .kern-wave { flex: 1; display: flex; gap: 3px; height: 26px; align-items: flex-end; }
  .kern-wave span { flex: 1; border-radius: 2px; height: 100%; transform-origin: bottom; animation: mwave 1.3s ease-in-out infinite; }
  @keyframes mwave { 0%, 100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }
  .kern-hint { font: 400 10px 'IBM Plex Mono'; color: #9397ab; white-space: nowrap; }

  /* ---- Generic tile ---- */
  .tile {
    border-radius: 10px; background: var(--tile-bg); box-shadow: 0 0 0 1px var(--tile-border);
    padding: 15px; display: flex; flex-direction: column; gap: 9px; overflow: hidden; min-width: 0; min-height: 0;
    transition: box-shadow .2s ease, transform .2s ease;
  }
  .tile.dragging { opacity: .4; }
  .tile.emphasize { box-shadow: 0 0 0 1px var(--accent-light), 0 0 20px rgba(181,171,252,.35); transform: scale(1.015); z-index: 2; }
  .tile-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .tile-title {
    font: 500 9px 'IBM Plex Mono'; letter-spacing: .12em; text-transform: uppercase; color: var(--text-weak);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tile-actions { display: flex; gap: 5px; flex: 0 0 auto; }
  .tile-actions button {
    padding: 5px 6px; border-radius: 5px; border: 1px solid var(--border-strong); background: transparent;
    color: #9397ab; font: 400 11px 'Inter'; cursor: pointer; line-height: 1;
  }
  .tile-actions button:hover { border-color: var(--accent); color: var(--accent-text); }
  .tile-actions button.danger:hover { border-color: var(--accent-light); color: var(--accent-brightest); }
  .tile-body { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 8px; }
  .empty-note { font: 400 11.5px 'Inter'; color: var(--text-dim); }

  /* Termine */
  .agenda-row { display: flex; gap: 8px; }
  .agenda-bar { width: 2px; border-radius: 1px; background: var(--border-strong); flex: 0 0 auto; }
  .agenda-row.next .agenda-bar { background: var(--accent-light); }
  .agenda-time { font: 500 12px 'IBM Plex Mono'; color: #9397ab; }
  .agenda-row.next .agenda-time { color: var(--accent-text); }
  .agenda-title { font-size: 12.5px; color: var(--text); }
  .agenda-meta { font-size: 11px; color: var(--text-weak); }

  /* Wetter */
  .weather-temp { font: 500 42px/1 'Inter'; letter-spacing: -.03em; }
  .weather-cond { font-size: 11px; color: #9397ab; }

  /* Ziele */
  .goal-row .goal-label-row { display: flex; justify-content: space-between; font-size: 12px; }
  .goal-row .goal-value { font: 500 11px 'IBM Plex Mono'; color: var(--accent-text); }
  .goal-track { height: 5px; border-radius: 3px; background: var(--tile-border); margin-top: 4px; overflow: hidden; }
  .goal-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--accent-deep1), var(--accent-light)); }

  /* Portfolio */
  #tile-portfolio .tile-body { flex-direction: row; flex-wrap: wrap; align-content: flex-start; }
  .portfolio-chip { padding: 5px 9px; border-radius: 7px; background: rgba(145,132,217,.14); border: 1px solid rgba(145,132,217,.35); font-size: 11.5px; color: var(--accent-text); }

  /* Aufgaben */
  .todo-row { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .todo-box { width: 11px; height: 11px; border-radius: 3px; border: 1px solid var(--accent); flex: 0 0 auto; }
  .todo-row.done .todo-box { background: var(--accent); }
  .todo-text { font-size: 12px; color: var(--text); }
  .todo-row.done .todo-text { color: var(--text-weak); text-decoration: line-through; }
  .todo-footer { margin-top: auto; font: 400 10px 'IBM Plex Mono'; color: var(--text-weak); }

  /* Live-Aktivität */
  .act-row { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--text-dim); }
  .act-dot { width: 5px; height: 5px; border-radius: 50%; background: #595d6c; flex: 0 0 auto; }
  .act-row.latest .act-dot { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .act-time { color: var(--text-weak); }

  /* Gedächtnis */
  .fact-row { font-size: 12px; color: #9397ab; }
  .fact-row.latest { color: var(--text); }

  /* ---- Chat dock ---- */
  #chat-dock {
    position: relative; z-index: 1; margin: 0 26px 18px; border-radius: 12px;
    background: rgba(27,29,43,.92); box-shadow: 0 0 0 1px #3f424d; flex: 0 0 auto;
    display: flex; flex-direction: column;
  }
  #chat-log { max-height: 150px; overflow: auto; padding: 14px 16px 4px; display: flex; flex-direction: column; gap: 9px; }
  .msg-row { display: flex; gap: 8px; align-items: flex-start; }
  .msg-row.user { justify-content: flex-end; }
  .avatar {
    width: 16px; height: 16px; border-radius: 50%; flex: 0 0 auto; margin-top: 2px;
    border: 1px solid var(--accent); background: radial-gradient(circle at 35% 30%, var(--accent-light), #2b2741);
  }
  .msg-text { font-size: 12.5px; line-height: 1.5; color: var(--text); max-width: 820px; white-space: pre-wrap; text-wrap: pretty; }
  .msg-bubble {
    color: var(--accent-text); background: rgba(145,132,217,.14); border: 1px solid rgba(145,132,217,.35);
    border-radius: 9px; padding: 6px 11px; max-width: 620px; font-size: 12.5px; line-height: 1.5; white-space: pre-wrap;
  }
  .msg-system { align-self: center; color: var(--text-weak); font-size: 11px; letter-spacing: .5px; text-transform: uppercase; }
  .msg-briefing, .msg-selfdev {
    align-self: stretch; border-radius: 10px; padding: 10px 12px; font-size: 12.5px; line-height: 1.5;
    white-space: pre-wrap; max-width: 100%;
  }
  .msg-briefing { background: rgba(255,179,71,.1); border: 1px solid rgba(255,179,71,.3); }
  .msg-selfdev { background: rgba(145,132,217,.1); border: 1px solid rgba(145,132,217,.35); }
  .msg-tag { font: 500 10px 'IBM Plex Mono'; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 6px; }
  .msg-briefing .msg-tag { color: #ffb347; }
  .msg-selfdev .msg-tag { color: var(--accent-light); }

  .confirm-box {
    align-self: flex-start; background: #14151f; border: 1px solid rgba(145,132,217,.4);
    border-radius: 10px; padding: 10px 12px; max-width: 92%;
  }
  .confirm-box .label { color: var(--text-dim); font-size: 11.5px; }
  .confirm-box code {
    display: block; background: #0d0e15; padding: 8px 10px; border-radius: 7px; margin: 7px 0;
    overflow-x: auto; font-size: 12px; color: var(--accent-light); border: 1px solid var(--tile-border);
  }
  .confirm-buttons { display: flex; gap: 8px; margin-top: 4px; }
  .confirm-buttons button {
    flex: 1; padding: 7px; border-radius: 7px; border: none; font-weight: 600; font-size: 12px;
    cursor: pointer; font-family: 'Inter';
  }
  .btn-allow { background: linear-gradient(90deg, #3ddc84, #00c2b8); color: #05210f; }
  .btn-deny { background: linear-gradient(90deg, #ff6b6b, #ff3d81); color: #2a0808; }

  .thinking { align-self: flex-start; display: flex; gap: 4px; padding: 4px 2px; }
  .thinking span {
    width: 4px; height: 4px; border-radius: 50%; background: var(--accent);
    animation: mpulse 1s infinite; opacity: .25;
  }
  .thinking span:nth-child(2) { animation-delay: .2s; }
  .thinking span:nth-child(3) { animation-delay: .4s; }
  @keyframes mpulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }

  #chat-quick { display: flex; gap: 8px; padding: 0 16px 10px; flex-wrap: wrap; }
  #chat-quick button {
    padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border-strong); background: transparent;
    color: var(--text-dim); font: 400 11.5px 'Inter'; cursor: pointer;
  }
  #chat-quick button:hover { border-color: var(--accent); color: var(--accent-text); }

  form#inputbar { height: 60px; padding: 0 12px 0 18px; gap: 10px; display: flex; align-items: center; border-top: 1px solid var(--tile-border); }
  .prompt-caret { font: 400 12px 'IBM Plex Mono'; color: var(--accent); flex: 0 0 auto; }
  #text {
    flex: 1; background: transparent; border: none; outline: none; color: var(--text);
    font: 400 13px 'Inter'; min-width: 0;
  }
  #text::placeholder { color: var(--text-weak); }
  #mic {
    width: 34px; height: 34px; flex: 0 0 auto; border-radius: 8px; border: 1px solid var(--border-strong);
    background: transparent; color: var(--text-dim); font-size: 15px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  #mic.listening { border-color: var(--accent-light); color: var(--accent-brightest); box-shadow: 0 0 8px rgba(181,171,252,.5); }
  #mic:disabled { opacity: .35; cursor: default; }
  #send {
    width: 38px; height: 38px; flex: 0 0 auto; border-radius: 9px; border: 1px solid var(--accent);
    background: rgba(145,132,217,.14); color: var(--accent-text); font-size: 16px; cursor: pointer;
  }
  #send:hover { background: rgba(145,132,217,.28); }
  #send:disabled { opacity: .5; }
</style>
</head>
<body>
<div class="overlay-grid"></div>
<div class="overlay-glow"></div>

<div id="topbar">
  <div class="wordmark">Moni</div>
  <div class="datetime mono" id="topbar-datetime">–</div>
  <div class="spacer"></div>
  <div class="stats">
    <span>CPU <b id="stat-cpu">–</b></span>
    <span>RAM <b id="stat-ram">–</b></span>
    <span class="online" id="stat-online">● online</span>
  </div>
  <a class="session-link" href="#" id="reset">Verlauf löschen</a>
  <a class="session-link" href="/logout">Abmelden</a>
  <button id="edit-toggle">Kacheln anpassen</button>
</div>

<div id="edit-bar">
  <span class="label mono">AUSGEBLENDET</span>
  <div id="hidden-chips"></div>
</div>

<div id="grid">
  <div id="kern-tile">
    <moni-core accent="#b5abfc" accent2="#9184d9"></moni-core>
    <div class="kern-overlay">
      <div class="kern-top">
        <div>
          <div class="kern-kicker mono">Kern · aktiv</div>
          <div class="kern-title">Ich höre zu.</div>
        </div>
        <div class="kern-meta mono">
          <div id="kern-model">Modell –</div>
          <div id="kern-context">Kontext – %</div>
          <div class="hl" id="kern-latency">Latenz – ms</div>
        </div>
      </div>
      <div class="kern-bottom">
        <div class="kern-wave" id="kern-wave"></div>
        <div class="kern-hint mono">Ziehen zum Drehen</div>
      </div>
    </div>
  </div>
  <!-- generic tiles injected here -->
</div>

<div id="chat-dock">
  <div id="chat-log"></div>
  <div id="chat-quick">
    <button data-msg="Wie sieht mein Tagesplan aus?">Tagesplan</button>
    <button data-msg="Heft eine Notiz auf meiner Startseite an.">Notiz anheften</button>
    <button data-msg="Was steht auf meiner Aufgabenliste?">Aufgaben</button>
  </div>
  <form id="inputbar">
    <span class="prompt-caret mono">&gt;</span>
    <input id="text" placeholder="Sprich mit Moni oder tippe …" autocomplete="off" />
    <button id="mic" type="button" title="Spracheingabe">🎤</button>
    <button id="send" type="submit">↑</button>
  </form>
</div>

<script>
/* ---- Waveform bars ---- */
(function () {
  const wave = document.getElementById('kern-wave');
  const colors = ['#5d5294', '#796cbf', '#9184d9', '#b5abfc'];
  for (let i = 0; i < 10; i++) {
    const bar = document.createElement('span');
    bar.style.background = colors[i % colors.length];
    bar.style.animationDelay = (i * 0.09) + 's';
    wave.appendChild(bar);
  }
})();

/* ---- Topbar clock ---- */
function renderTopbarClock() {
  const now = new Date();
  const date = now.toLocaleDateString('de-DE', { weekday: 'long', day: '2-digit', month: 'long' });
  const time = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  document.getElementById('topbar-datetime').textContent = `${date} · ${time}`;
}
renderTopbarClock();
setInterval(renderTopbarClock, 30000);

/* =========================================================
   Tile grid: state, rendering, edit mode, drag & drop
   ========================================================= */
let tiles = [
  { id: 'termine', w: 1, h: 2, on: true },
  { id: 'wetter', w: 1, h: 1, on: true },
  { id: 'ziele', w: 1, h: 1, on: true },
  { id: 'portfolio', w: 2, h: 1, on: true },
  { id: 'aufgaben', w: 1, h: 1, on: true },
  { id: 'aktivitaet', w: 1, h: 1, on: true },
  { id: 'gedaechtnis', w: 1, h: 1, on: false },
];
let editMode = false;
let dragId = null;
let lastStatus = null;

const grid = document.getElementById('grid');
const kernTileEl = document.getElementById('kern-tile');
const editBar = document.getElementById('edit-bar');
const hiddenChips = document.getElementById('hidden-chips');
const editToggle = document.getElementById('edit-toggle');

function tileTitle(t) {
  const s = lastStatus || {};
  if (t.id === 'termine') return 'Termine';
  if (t.id === 'wetter') return (s.weather && s.weather.city) || 'Wetter';
  if (t.id === 'ziele') return 'Ziele';
  if (t.id === 'portfolio') return 'Portfolio';
  if (t.id === 'aufgaben') return 'Aufgaben';
  if (t.id === 'aktivitaet') return 'Live-Aktivität';
  if (t.id === 'gedaechtnis') return `Gedächtnis · ${s.profile_facts ?? 0} Fakten`;
  return t.id;
}

function renderTermineBody() {
  const wrap = document.createElement('div');
  const note = document.createElement('div');
  note.className = 'empty-note';
  note.textContent = 'Kalender nicht verbunden.';
  wrap.appendChild(note);
  return wrap;
}

function renderWetterBody(weather) {
  const wrap = document.createElement('div');
  if (!weather) {
    const note = document.createElement('div');
    note.className = 'empty-note';
    note.textContent = 'Kein Standort hinterlegt. Sag Moni im Chat, wo du wohnst.';
    wrap.appendChild(note);
    return wrap;
  }
  const temp = document.createElement('div');
  temp.className = 'weather-temp';
  temp.textContent = Math.round(weather.temperature) + '°';
  const cond = document.createElement('div');
  cond.className = 'weather-cond';
  cond.textContent = weather.condition;
  wrap.appendChild(temp);
  wrap.appendChild(cond);
  return wrap;
}

function renderZieleBody(goals) {
  const wrap = document.createElement('div');
  if (!goals || !goals.length) {
    const note = document.createElement('div');
    note.className = 'empty-note';
    note.textContent = 'Noch keine Ziele gesetzt.';
    wrap.appendChild(note);
    return wrap;
  }
  for (const g of goals) {
    const pct = g.target ? Math.min(100, Math.round(g.current / g.target * 100)) : 0;
    const row = document.createElement('div');
    row.className = 'goal-row';
    row.innerHTML = `
      <div class="goal-label-row"><span>${escapeHtml(g.label)}</span><span class="goal-value mono">${g.current}/${g.target}</span></div>
      <div class="goal-track"><div class="goal-fill" style="width:${pct}%"></div></div>
    `;
    wrap.appendChild(row);
  }
  return wrap;
}

function renderPortfolioBody(positions) {
  const wrap = document.createElement('div');
  if (!positions || !positions.length) {
    const note = document.createElement('div');
    note.className = 'empty-note';
    note.textContent = 'Keine Positionen hinterlegt.';
    wrap.appendChild(note);
    return wrap;
  }
  for (const name of positions) {
    const chip = document.createElement('div');
    chip.className = 'portfolio-chip';
    chip.textContent = name;
    wrap.appendChild(chip);
  }
  return wrap;
}

function renderAufgabenBody(todoItems) {
  const wrap = document.createElement('div');
  if (!todoItems || !todoItems.length) {
    const note = document.createElement('div');
    note.className = 'empty-note';
    note.textContent = 'Keine Aufgaben.';
    wrap.appendChild(note);
    return wrap;
  }
  todoItems.forEach((item, idx) => {
    const row = document.createElement('div');
    row.className = 'todo-row' + (item.done ? ' done' : '');
    const box = document.createElement('div');
    box.className = 'todo-box';
    const text = document.createElement('div');
    text.className = 'todo-text';
    text.textContent = item.text;
    row.appendChild(box);
    row.appendChild(text);
    row.addEventListener('click', async () => {
      await api('/api/todo/toggle', { index: idx });
      loadStatus();
    });
    wrap.appendChild(row);
  });
  const openCount = todoItems.filter(t => !t.done).length;
  const footer = document.createElement('div');
  footer.className = 'todo-footer mono';
  footer.textContent = `${openCount} offen`;
  wrap.appendChild(footer);
  return wrap;
}

function renderAktivitaetBody(entries) {
  const wrap = document.createElement('div');
  if (!entries || !entries.length) {
    const note = document.createElement('div');
    note.className = 'empty-note';
    note.textContent = 'Noch keine Aktivität.';
    wrap.appendChild(note);
    return wrap;
  }
  entries.slice(0, 3).forEach((e, idx) => {
    const row = document.createElement('div');
    row.className = 'act-row' + (idx === 0 ? ' latest' : '');
    row.innerHTML = `<span class="act-dot"></span><span>${escapeHtml(e.text)} · <span class="act-time mono">${escapeHtml(e.relative)}</span></span>`;
    wrap.appendChild(row);
  });
  return wrap;
}

function renderGedaechtnisBody(factList) {
  const wrap = document.createElement('div');
  if (!factList || !factList.length) {
    const note = document.createElement('div');
    note.className = 'empty-note';
    note.textContent = 'Noch nichts gemerkt.';
    wrap.appendChild(note);
    return wrap;
  }
  factList.slice().reverse().forEach((f, idx) => {
    const row = document.createElement('div');
    row.className = 'fact-row' + (idx === 0 ? ' latest' : '');
    row.textContent = `„${f.fact}"`;
    wrap.appendChild(row);
  });
  return wrap;
}

function renderTileBody(t) {
  const s = lastStatus || {};
  switch (t.id) {
    case 'termine': return renderTermineBody();
    case 'wetter': return renderWetterBody(s.weather);
    case 'ziele': return renderZieleBody(s.goals);
    case 'portfolio': return renderPortfolioBody(s.portfolio_positions);
    case 'aufgaben': return renderAufgabenBody(s.todos);
    case 'aktivitaet': return renderAktivitaetBody(s.activity);
    case 'gedaechtnis': return renderGedaechtnisBody(s.profile_fact_list);
    default: return document.createElement('div');
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

function buildTileEl(t) {
  const el = document.createElement('div');
  el.className = 'tile';
  el.id = 'tile-' + t.id;
  el.dataset.id = t.id;
  el.style.gridColumn = 'span ' + t.w;
  el.style.gridRow = 'span ' + t.h;

  const head = document.createElement('div');
  head.className = 'tile-head';
  const title = document.createElement('div');
  title.className = 'tile-title mono';
  title.textContent = tileTitle(t);
  head.appendChild(title);

  if (editMode) {
    const actions = document.createElement('div');
    actions.className = 'tile-actions';

    const widthBtn = document.createElement('button');
    widthBtn.textContent = '↔';
    widthBtn.title = 'Breite umschalten';
    widthBtn.addEventListener('click', () => { t.w = t.w === 1 ? 2 : 1; renderGrid(); });

    const heightBtn = document.createElement('button');
    heightBtn.textContent = '↕';
    heightBtn.title = 'Höhe umschalten';
    heightBtn.addEventListener('click', () => { t.h = t.h === 1 ? 2 : 1; renderGrid(); });

    const hideBtn = document.createElement('button');
    hideBtn.textContent = '✕';
    hideBtn.className = 'danger';
    hideBtn.title = 'Ausblenden';
    hideBtn.addEventListener('click', () => { t.on = false; renderGrid(); });

    actions.appendChild(widthBtn);
    actions.appendChild(heightBtn);
    actions.appendChild(hideBtn);
    head.appendChild(actions);

    el.draggable = true;
    el.addEventListener('dragstart', () => { dragId = t.id; el.classList.add('dragging'); });
    el.addEventListener('dragend', () => { dragId = null; el.classList.remove('dragging'); });
    el.addEventListener('dragover', (e) => {
      e.preventDefault();
      if (!dragId || dragId === t.id) return;
      const fromIdx = tiles.findIndex(x => x.id === dragId);
      const toIdx = tiles.findIndex(x => x.id === t.id);
      if (fromIdx === -1 || toIdx === -1) return;
      const [moved] = tiles.splice(fromIdx, 1);
      tiles.splice(toIdx, 0, moved);
      renderGrid();
    });
  }

  const body = document.createElement('div');
  body.className = 'tile-body';
  body.appendChild(renderTileBody(t));

  el.appendChild(head);
  el.appendChild(body);
  return el;
}

function renderEditBar() {
  const hiddenTiles = tiles.filter(t => !t.on);
  editBar.classList.toggle('show', editMode && hiddenTiles.length > 0);
  hiddenChips.innerHTML = '';
  for (const t of hiddenTiles) {
    const chip = document.createElement('button');
    chip.className = 'chip-hidden';
    chip.textContent = tileTitle(t);
    chip.addEventListener('click', () => { t.on = true; renderGrid(); });
    hiddenChips.appendChild(chip);
  }
}

function renderGrid() {
  grid.querySelectorAll('.tile').forEach(el => el.remove());
  for (const t of tiles) {
    if (!t.on) continue;
    grid.appendChild(buildTileEl(t));
  }
  renderEditBar();
}

editToggle.addEventListener('click', () => {
  editMode = !editMode;
  editToggle.textContent = editMode ? 'Fertig' : 'Kacheln anpassen';
  renderGrid();
});

/* ---- Topic emphasis when a tile's subject comes up in chat ---- */
const TOOL_TO_TILE = {
  list_portfolio: 'portfolio', add_portfolio_position: 'portfolio', remove_portfolio_position: 'portfolio',
  remember_about_user: 'gedaechtnis', recall_about_user: 'gedaechtnis', forget_about_user: 'gedaechtnis',
  set_location: 'wetter',
  list_todos: 'aufgaben', add_todo: 'aufgaben', complete_todo: 'aufgaben', remove_todo: 'aufgaben',
  list_goals: 'ziele', set_goal: 'ziele', update_goal_progress: 'ziele', remove_goal: 'ziele',
};

function emphasizeTiles(toolsUsed) {
  if (!toolsUsed || !toolsUsed.length) return;
  const ids = new Set(toolsUsed.map(t => TOOL_TO_TILE[t]).filter(Boolean));
  ids.forEach(id => {
    const el = document.getElementById('tile-' + id);
    if (!el) return;
    el.classList.add('emphasize');
    setTimeout(() => el.classList.remove('emphasize'), 6000);
  });
  if (ids.size) loadStatus();
}

/* =========================================================
   Status polling
   ========================================================= */
async function loadStatus() {
  try {
    const res = await fetch('/api/status');
    if (res.status === 401) { window.location.href = '/login'; return; }
    const data = await res.json();
    lastStatus = data;

    document.getElementById('kern-model').textContent = 'Modell ' + (data.model || '–');
    document.getElementById('kern-context').textContent = 'Kontext ' + (data.context_pct != null ? data.context_pct + ' %' : '–');
    document.getElementById('kern-latency').textContent = 'Latenz ' + (data.latency_ms != null ? data.latency_ms + ' ms' : '–');

    const sys = data.system || {};
    const cpuPct = sys.load1 != null ? Math.min(100, Math.round(sys.load1 * 100)) : null;
    document.getElementById('stat-cpu').textContent = cpuPct != null ? cpuPct + ' %' : '–';
    document.getElementById('stat-ram').textContent = sys.mem_used_percent != null ? sys.mem_used_percent + ' %' : '–';
    document.getElementById('stat-online').style.opacity = cpuPct != null ? '1' : '.4';

    renderGrid();
  } catch (err) {
    document.getElementById('stat-online').style.opacity = '.4';
  }
}
loadStatus();
setInterval(loadStatus, 15000);

/* =========================================================
   Chat dock (reuses the existing agent loop / confirm flow)
   ========================================================= */
const chatLog = document.getElementById('chat-log');
const form = document.getElementById('inputbar');
const textEl = document.getElementById('text');
const sendBtn = document.getElementById('send');

function scrollDown() { chatLog.scrollTop = chatLog.scrollHeight; }

function addBubble(role, text) {
  const row = document.createElement('div');
  row.className = 'msg-row ' + role;
  if (role === 'moni') {
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    const span = document.createElement('div');
    span.className = 'msg-text';
    span.textContent = text;
    row.appendChild(avatar);
    row.appendChild(span);
  } else {
    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = text;
    row.appendChild(bubble);
  }
  chatLog.appendChild(row);
  scrollDown();
  return row;
}

function addBriefing(text) {
  const box = document.createElement('div');
  box.className = 'msg-briefing';
  box.innerHTML = `<div class="msg-tag mono">Morgen-Briefing</div><div>${escapeHtml(text)}</div>`;
  chatLog.appendChild(box);
  scrollDown();
}

function addSelfDevSuggestion(text) {
  const box = document.createElement('div');
  box.className = 'msg-selfdev';
  box.innerHTML = `<div class="msg-tag mono">Verbesserungsvorschlag</div><div>${escapeHtml(text)}</div>`;
  chatLog.appendChild(box);
  scrollDown();
}

function addSystem(text) {
  const div = document.createElement('div');
  div.className = 'msg-system';
  div.textContent = text;
  chatLog.appendChild(div);
  scrollDown();
}

function addThinking() {
  const div = document.createElement('div');
  div.className = 'thinking';
  div.innerHTML = '<span></span><span></span><span></span>';
  chatLog.appendChild(div);
  scrollDown();
  return div;
}

const CONFIRM_LABELS = {
  run_shell_command: 'Moni möchte einen Befehl ausführen:',
  write_file: 'Moni möchte eine Datei schreiben:',
  propose_code_change: 'Moni möchte sich selbst weiterentwickeln (neuer Git-Branch, kein Deploy):',
};

function confirmDetail(tool, input) {
  if (tool === 'run_shell_command') return input.command || '';
  if (tool === 'write_file') return input.path || '';
  if (tool === 'propose_code_change') return input.description || '';
  return JSON.stringify(input);
}

function addConfirm(tool, input) {
  const box = document.createElement('div');
  box.className = 'confirm-box';

  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = CONFIRM_LABELS[tool] || `Moni möchte "${tool}" ausführen:`;
  box.appendChild(label);

  const code = document.createElement('code');
  code.textContent = confirmDetail(tool, input);
  box.appendChild(code);

  const buttons = document.createElement('div');
  buttons.className = 'confirm-buttons';

  const allow = document.createElement('button');
  allow.className = 'btn-allow';
  allow.textContent = 'Erlauben';
  const deny = document.createElement('button');
  deny.className = 'btn-deny';
  deny.textContent = 'Ablehnen';

  allow.onclick = () => resolveConfirm(true, box);
  deny.onclick = () => resolveConfirm(false, box);

  buttons.appendChild(allow);
  buttons.appendChild(deny);
  box.appendChild(buttons);

  chatLog.appendChild(box);
  scrollDown();
}

function setBusy(busy) {
  sendBtn.disabled = busy;
  textEl.disabled = busy;
}

let germanVoice = null;
function loadVoices() {
  if (!('speechSynthesis' in window)) return;
  const voices = window.speechSynthesis.getVoices();
  germanVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('de')) || null;
}
if ('speechSynthesis' in window) {
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'de-DE';
  if (germanVoice) utter.voice = germanVoice;
  window.speechSynthesis.speak(utter);
}

/* ---- Voice input ---- */
const micBtn = document.getElementById('mic');
const SpeechRecognitionImpl = window.SpeechRecognition || window.webkitSpeechRecognition;

if (SpeechRecognitionImpl) {
  const recognizer = new SpeechRecognitionImpl();
  recognizer.lang = 'de-DE';
  recognizer.continuous = false;
  recognizer.interimResults = false;
  let recognizing = false;

  recognizer.onstart = () => { recognizing = true; micBtn.classList.add('listening'); };
  recognizer.onend = () => {
    recognizing = false;
    micBtn.classList.remove('listening');
    // iOS Safari shares one audio session between mic and speaker - re-prime
    // speechSynthesis here (still gesture-adjacent) so it keeps working.
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));
    }
  };
  recognizer.onerror = (e) => {
    recognizing = false;
    micBtn.classList.remove('listening');
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      addSystem('Mikrofon-Zugriff nicht erlaubt - bitte in den Safari-Einstellungen aktivieren.');
    } else if (e.error !== 'no-speech' && e.error !== 'aborted') {
      addSystem('Spracheingabe-Fehler: ' + e.error);
    }
  };
  recognizer.onresult = (e) => {
    const transcript = e.results[0][0].transcript;
    if (!transcript.trim()) return;
    textEl.value = transcript;
    form.requestSubmit();
  };

  micBtn.addEventListener('click', () => {
    if (recognizing) { recognizer.stop(); return; }
    window.speechSynthesis.cancel();
    try { recognizer.start(); } catch (err) { /* already starting */ }
  });
} else {
  micBtn.disabled = true;
  micBtn.title = 'Spracheingabe wird von diesem Browser nicht unterstützt';
}

function handleResult(data, thinkingEl) {
  if (thinkingEl) thinkingEl.remove();
  if (data.status === 'confirm') {
    addConfirm(data.tool, data.input);
  } else if (data.status === 'reply') {
    addBubble('moni', data.text);
    setBusy(false);
    speak(data.text);
    emphasizeTiles(data.tools_used);
  } else {
    addSystem('[Fehler] ' + (data.text || 'Unbekannter Fehler'));
    setBusy(false);
  }
}

async function api(path, body) {
  const res = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}),
  });
  if (res.status === 401) {
    window.location.href = '/login';
    throw new Error('unauthenticated');
  }
  return res.json();
}

async function resolveConfirm(approved, box) {
  box.querySelectorAll('button').forEach(b => b.disabled = true);
  const thinkingEl = addThinking();
  setBusy(true);
  const data = await api('/api/confirm', { approved });
  handleResult(data, thinkingEl);
}

async function sendMessage(text) {
  addBubble('user', text);
  textEl.value = '';
  setBusy(true);
  const thinkingEl = addThinking();
  const data = await api('/api/chat', { message: text });
  handleResult(data, thinkingEl);
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = textEl.value.trim();
  if (!text) return;
  sendMessage(text);
});

document.querySelectorAll('#chat-quick button').forEach(btn => {
  btn.addEventListener('click', () => sendMessage(btn.dataset.msg));
});

document.getElementById('reset').addEventListener('click', async (e) => {
  e.preventDefault();
  if (!confirm('Gesprächsverlauf wirklich löschen?')) return;
  await api('/api/reset', {});
  chatLog.innerHTML = '';
  addSystem('Verlauf gelöscht.');
});

async function loadHistory() {
  try {
    const res = await fetch('/api/history');
    if (res.status === 401) { window.location.href = '/login'; return; }
    const items = await res.json();
    if (!items.length) {
      addSystem('Noch kein Verlauf – schreib Moni etwas.');
      return;
    }
    for (const item of items) {
      if (item.role === 'briefing') addBriefing(item.text);
      else if (item.role === 'selfdev') addSelfDevSuggestion(item.text);
      else addBubble(item.role === 'user' ? 'user' : 'moni', item.text);
    }
  } catch (err) {
    addSystem('Verlauf konnte nicht geladen werden.');
  }
}
loadHistory();
</script>
