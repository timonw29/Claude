<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Moni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root {
    color-scheme: dark;
    --bg: #050710;
    --panel: rgba(15, 20, 35, 0.6);
    --panel-solid: #0d1220;
    --border: rgba(0, 229, 255, 0.2);
    --cyan: #00e5ff;
    --violet: #7c5cff;
    --amber: #ffb347;
    --text: #e6f1ff;
    --muted: #7d8aa8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font-family: 'Rajdhani', -apple-system, sans-serif;
    position: relative; overflow: hidden;
  }
  body::before {
    content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(0,229,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.04) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, black 20%, transparent 75%);
  }

  header {
    position: relative; z-index: 1;
    padding: 14px 18px; display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border); flex: 0 0 auto;
    background: rgba(5,7,16,0.7); backdrop-filter: blur(10px);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .core {
    width: 22px; height: 22px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, var(--cyan), var(--violet) 70%);
    box-shadow: 0 0 14px rgba(0,229,255,0.7);
    animation: breathe 2.4s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { transform: scale(0.9); opacity: 0.85; } 50% { transform: scale(1.05); opacity: 1; } }
  header h1 {
    font-family: 'Orbitron', sans-serif; font-size: 16px; margin: 0; letter-spacing: 3px;
    background: linear-gradient(90deg, var(--cyan), var(--violet));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header .actions { display: flex; gap: 16px; font-size: 13px; }
  header a { color: var(--muted); text-decoration: none; letter-spacing: 1px; text-transform: uppercase; }
  header a:active { color: var(--cyan); }

  nav.tabs {
    position: relative; z-index: 1; flex: 0 0 auto; display: flex; gap: 4px;
    padding: 8px 14px 0; background: rgba(5,7,16,0.7); backdrop-filter: blur(10px);
  }
  nav.tabs button {
    flex: 1; padding: 10px; border: none; background: transparent; color: var(--muted);
    font-family: 'Rajdhani', sans-serif; font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase;
    font-weight: 600; border-bottom: 2px solid transparent; cursor: pointer;
  }
  nav.tabs button.active { color: var(--cyan); border-bottom-color: var(--cyan); }

  .view { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .view[hidden] { display: none; }

  /* ---- Dashboard ---- */
  #dashboard {
    position: relative; z-index: 1; overflow-y: auto; padding: 20px 16px 32px;
    -webkit-overflow-scrolling: touch;
  }
  .hero {
    display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 28px 0 22px;
  }
  #core-canvas {
    width: 150px; height: 150px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, var(--cyan), var(--violet) 75%);
    filter: drop-shadow(0 0 25px rgba(0,229,255,0.55)) drop-shadow(0 0 50px rgba(124,92,255,0.25));
  }
  .hero .status-line {
    font-family: 'Orbitron', sans-serif; font-size: 12px; letter-spacing: 3px; color: var(--cyan);
    text-transform: uppercase;
  }
  .hero .model-line { font-size: 13px; color: var(--muted); }

  .tile-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; perspective: 900px; }
  .tile {
    background: linear-gradient(155deg, rgba(255,255,255,0.05), rgba(15,20,35,0.4) 40%), var(--panel);
    border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px;
    backdrop-filter: blur(8px); transform-style: preserve-3d; transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 10px 24px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.06);
    will-change: transform;
  }
  .tile.wide { grid-column: 1 / -1; }
  .tile .tile-label {
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .tile .tile-label .dot { width: 6px; height: 6px; border-radius: 50%; background: #3ddc84; box-shadow: 0 0 6px #3ddc84; }
  .tile .tile-label .dot.off { background: var(--muted); box-shadow: none; }
  .tile .big-value { font-family: 'Orbitron', sans-serif; font-size: 22px; color: var(--cyan); }
  .tile .sub-value { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .tile.placeholder { opacity: 0.55; }
  .tile.placeholder .big-value { font-size: 14px; color: var(--muted); font-family: 'Rajdhani', sans-serif; }

  .gauge-row { display: flex; justify-content: space-around; }
  .gauge { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; }
  .gauge span.pct { font-size: 12px; font-weight: 700; }
  .gauge .gcap { position: absolute; bottom: -18px; font-size: 10.5px; color: var(--muted); white-space: nowrap; left: 50%; transform: translateX(-50%); }

  .chip-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 7px 12px; border-radius: 20px; border: 1px solid var(--border); font-size: 13px;
    background: rgba(124,92,255,0.1); color: var(--text);
  }

  /* ---- Chat ---- */
  #log {
    position: relative; z-index: 1;
    flex: 1 1 auto; overflow-y: auto; padding: 18px 16px; display: flex; flex-direction: column; gap: 14px;
    -webkit-overflow-scrolling: touch;
  }
  .bubble {
    max-width: 84%; padding: 12px 16px; border-radius: 16px; line-height: 1.45;
    white-space: pre-wrap; word-break: break-word; font-size: 15.5px;
  }
  .user {
    align-self: flex-end; color: #05070f; font-weight: 500;
    background: linear-gradient(135deg, var(--cyan), var(--violet));
    border-bottom-right-radius: 4px;
  }
  .moni {
    align-self: flex-start; background: var(--panel); border: 1px solid var(--border);
    backdrop-filter: blur(8px); border-bottom-left-radius: 4px;
  }
  .system { align-self: center; color: var(--muted); font-size: 12.5px; letter-spacing: 1px; text-transform: uppercase; }

  .briefing {
    align-self: stretch; background: linear-gradient(135deg, rgba(255,179,71,0.12), rgba(15,20,35,0.6));
    border: 1px solid rgba(255,179,71,0.35); border-radius: 16px; padding: 14px 16px; max-width: 100%;
  }
  .briefing .tag {
    display: flex; align-items: center; gap: 8px; font-family: 'Orbitron', sans-serif;
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--amber); margin-bottom: 8px;
  }
  .briefing .tag::before { content: '\2600'; }
  .briefing .body { font-size: 15.5px; line-height: 1.45; white-space: pre-wrap; }

  .confirm-box {
    align-self: flex-start; background: var(--panel-solid); border: 1px solid rgba(124,92,255,0.4);
    border-radius: 16px; padding: 14px 16px; max-width: 92%;
  }
  .confirm-box .label { color: var(--muted); font-size: 13px; letter-spacing: 0.5px; }
  .confirm-box code {
    display: block; background: #05070f; padding: 9px 11px; border-radius: 8px; margin: 8px 0;
    overflow-x: auto; font-size: 13px; color: var(--cyan); border: 1px solid var(--border);
  }
  .confirm-buttons { display: flex; gap: 10px; margin-top: 8px; }
  .confirm-buttons button {
    flex: 1; padding: 10px; border-radius: 9px; border: none; font-weight: 700; font-size: 14.5px;
    cursor: pointer; letter-spacing: 0.5px; text-transform: uppercase; font-family: 'Rajdhani', sans-serif;
  }
  .btn-allow { background: linear-gradient(90deg, #3ddc84, #00e5ff); color: #05210f; }
  .btn-deny { background: linear-gradient(90deg, #ff6b6b, #ff3d81); color: #2a0808; }

  .thinking { align-self: flex-start; display: flex; gap: 5px; padding: 6px 4px; }
  .thinking span {
    width: 7px; height: 7px; border-radius: 50%; background: var(--cyan);
    animation: blink 1.1s infinite ease-in-out;
  }
  .thinking span:nth-child(2) { animation-delay: 0.15s; }
  .thinking span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  form#inputbar {
    position: relative; z-index: 1;
    flex: 0 0 auto; display: flex; gap: 10px; padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border); background: rgba(5,7,16,0.7); backdrop-filter: blur(10px);
  }
  #text {
    flex: 1; font-size: 16px; padding: 13px 16px; border-radius: 22px; border: 1px solid var(--border);
    background: rgba(15,20,35,0.7); color: var(--text); font-family: inherit;
  }
  #text:focus { outline: none; border-color: var(--cyan); }
  #send {
    padding: 0 20px; border-radius: 22px; border: none;
    background: linear-gradient(90deg, var(--cyan), var(--violet)); color: #05070f; font-weight: 700;
    letter-spacing: 0.5px; text-transform: uppercase; font-family: 'Rajdhani', sans-serif;
  }
  #send:disabled { opacity: 0.5; }
</style>
</head>
<body>
<header>
  <div class="brand"><div class="core"></div><h1>MONI</h1></div>
  <div class="actions">
    <a href="#" id="reset">Verlauf löschen</a>
    <a href="/logout">Abmelden</a>
  </div>
</header>
<nav class="tabs">
  <button id="tab-dashboard" class="active">Dashboard</button>
  <button id="tab-chat">Chat</button>
</nav>

<div class="view" id="dashboard">
  <div class="hero">
    <canvas id="core-canvas"></canvas>
    <div class="status-line">System aktiv</div>
    <div class="model-line" id="hero-model">–</div>
  </div>

  <div class="tile-grid">
    <div class="tile" id="tile-weather">
      <div class="tile-label"><span>Wetter</span><span class="dot off" id="weather-dot"></span></div>
      <div class="big-value" id="weather-value">Kein Standort</div>
      <div class="sub-value" id="weather-sub">Sag Moni im Chat, wo du wohnst</div>
    </div>

    <div class="tile" id="tile-calendar">
      <div class="tile-label"><span>Kalender</span><span class="dot off"></span></div>
      <div class="big-value" style="font-size:14px;color:var(--muted);font-family:'Rajdhani',sans-serif;">Noch nicht verbunden</div>
      <div class="sub-value">Geplant für später</div>
    </div>

    <div class="tile wide">
      <div class="tile-label"><span>Server</span><span class="dot" id="server-dot"></span></div>
      <div class="gauge-row">
        <div><div class="gauge" id="gauge-cpu"></div></div>
        <div><div class="gauge" id="gauge-ram"></div></div>
        <div><div class="gauge" id="gauge-disk"></div></div>
      </div>
      <div class="sub-value" style="text-align:center; margin-top:22px;">CPU-Last · RAM · Speicher (Droplet)</div>
    </div>

    <div class="tile">
      <div class="tile-label"><span>Gedächtnis</span><span class="dot"></span></div>
      <div class="big-value" id="stat-profile">–</div>
      <div class="sub-value">Über dich gelernt</div>
    </div>

    <div class="tile">
      <div class="tile-label"><span>Portfolio</span><span class="dot"></span></div>
      <div class="big-value" id="stat-portfolio">–</div>
      <div class="sub-value">Positionen verfolgt</div>
    </div>

    <div class="tile wide">
      <div class="tile-label"><span>Nächstes Briefing</span><span class="dot"></span></div>
      <div class="big-value" id="stat-briefing">–</div>
      <div class="sub-value" id="stat-briefing-caption">–</div>
    </div>

    <div class="tile wide">
      <div class="tile-label"><span>Fähigkeiten</span><span class="dot"></span></div>
      <div class="chip-grid" id="tool-chips"></div>
    </div>
  </div>
</div>

<div class="view" id="chat-view" hidden>
  <div id="log"></div>
  <form id="inputbar">
    <input id="text" placeholder="Nachricht an Moni…" autocomplete="off" />
    <button id="send" type="submit">Senden</button>
  </form>
</div>

<script>
const log = document.getElementById('log');
const form = document.getElementById('inputbar');
const textEl = document.getElementById('text');
const sendBtn = document.getElementById('send');

function scrollDown() { log.scrollTop = log.scrollHeight; }

function addBubble(role, text) {
  const div = document.createElement('div');
  div.className = 'bubble ' + role;
  div.textContent = text;
  log.appendChild(div);
  scrollDown();
  return div;
}

function addBriefing(text) {
  const box = document.createElement('div');
  box.className = 'briefing';
  const tag = document.createElement('div');
  tag.className = 'tag';
  tag.textContent = 'Morgen-Briefing';
  const body = document.createElement('div');
  body.className = 'body';
  body.textContent = text;
  box.appendChild(tag);
  box.appendChild(body);
  log.appendChild(box);
  scrollDown();
}

function addSystem(text) {
  const div = document.createElement('div');
  div.className = 'system';
  div.textContent = text;
  log.appendChild(div);
  scrollDown();
}

function addThinking() {
  const div = document.createElement('div');
  div.className = 'thinking';
  div.innerHTML = '<span></span><span></span><span></span>';
  log.appendChild(div);
  scrollDown();
  return div;
}

function addConfirm(tool, input) {
  const box = document.createElement('div');
  box.className = 'confirm-box';

  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = tool === 'run_shell_command'
    ? 'Moni möchte einen Befehl ausführen:'
    : 'Moni möchte eine Datei schreiben:';
  box.appendChild(label);

  const code = document.createElement('code');
  code.textContent = tool === 'run_shell_command' ? (input.command || '') : (input.path || '');
  box.appendChild(code);

  const buttons = document.createElement('div');
  buttons.className = 'confirm-buttons';

  const allow = document.createElement('button');
  allow.className = 'btn-allow';
  allow.textContent = 'Erlauben';
  const deny = document.createElement('button');
  deny.className = 'btn-deny';
  deny.textContent = 'Ablehnen';

  allow.onclick = () => resolveConfirm(true, box);
  deny.onclick = () => resolveConfirm(false, box);

  buttons.appendChild(allow);
  buttons.appendChild(deny);
  box.appendChild(buttons);

  log.appendChild(box);
  scrollDown();
}

function setBusy(busy) {
  sendBtn.disabled = busy;
  textEl.disabled = busy;
}

let germanVoice = null;
function loadVoices() {
  if (!('speechSynthesis' in window)) return;
  const voices = window.speechSynthesis.getVoices();
  germanVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('de')) || null;
}
if ('speechSynthesis' in window) {
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel(); // don't overlap with a previous reply
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'de-DE';
  if (germanVoice) utter.voice = germanVoice;
  window.speechSynthesis.speak(utter);
}

function handleResult(data, thinkingEl) {
  if (thinkingEl) thinkingEl.remove();
  if (data.status === 'confirm') {
    addConfirm(data.tool, data.input);
  } else if (data.status === 'reply') {
    addBubble('moni', data.text);
    setBusy(false);
    speak(data.text);
  } else {
    addSystem('[Fehler] ' + (data.text || 'Unbekannter Fehler'));
    setBusy(false);
  }
}

async function api(path, body) {
  const res = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}),
  });
  if (res.status === 401) {
    window.location.href = '/login';
    throw new Error('unauthenticated');
  }
  return res.json();
}

async function resolveConfirm(approved, box) {
  box.querySelectorAll('button').forEach(b => b.disabled = true);
  const thinkingEl = addThinking();
  setBusy(true);
  const data = await api('/api/confirm', { approved });
  handleResult(data, thinkingEl);
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = textEl.value.trim();
  if (!text) return;
  addBubble('user', text);
  textEl.value = '';
  setBusy(true);
  const thinkingEl = addThinking();
  const data = await api('/api/chat', { message: text });
  handleResult(data, thinkingEl);
});

document.getElementById('reset').addEventListener('click', async (e) => {
  e.preventDefault();
  if (!confirm('Gesprächsverlauf wirklich löschen?')) return;
  await api('/api/reset', {});
  log.innerHTML = '';
  addSystem('Verlauf gelöscht.');
});

async function loadHistory() {
  try {
    const res = await fetch('/api/history');
    if (res.status === 401) {
      window.location.href = '/login';
      return;
    }
    const items = await res.json();
    if (!items.length) {
      addSystem('Noch kein Verlauf – schreib Moni etwas.');
      return;
    }
    for (const item of items) {
      if (item.role === 'briefing') addBriefing(item.text);
      else addBubble(item.role === 'user' ? 'user' : 'moni', item.text);
    }
  } catch (err) {
    addSystem('Verlauf konnte nicht geladen werden.');
  }
}

loadHistory();

/* ---- Tabs ---- */
const tabDashboard = document.getElementById('tab-dashboard');
const tabChat = document.getElementById('tab-chat');
const dashboardView = document.getElementById('dashboard');
const chatView = document.getElementById('chat-view');

function showTab(tab) {
  const showDash = tab === 'dashboard';
  dashboardView.hidden = !showDash;
  chatView.hidden = showDash;
  tabDashboard.classList.toggle('active', showDash);
  tabChat.classList.toggle('active', !showDash);
  if (showDash) loadStatus();
  else textEl.focus();
}
tabDashboard.addEventListener('click', () => showTab('dashboard'));
tabChat.addEventListener('click', () => showTab('chat'));

/* ---- Dashboard ---- */
const TOOL_LABELS = {
  run_shell_command: 'Shell-Befehle',
  read_file: 'Dateien lesen',
  write_file: 'Dateien schreiben',
  list_directory: 'Verzeichnisse',
  web_search: 'Websuche',
  list_portfolio: 'Portfolio ansehen',
  add_portfolio_position: 'Portfolio ergänzen',
  remove_portfolio_position: 'Portfolio bereinigen',
  remember_about_user: 'Über dich lernen',
  recall_about_user: 'Erinnerungen abrufen',
  forget_about_user: 'Erinnerungen löschen',
  set_location: 'Standort merken',
};

function gaugeColor(pct) {
  if (pct === null || pct === undefined) return '#3a4256';
  if (pct < 60) return '#3ddc84';
  if (pct < 85) return '#ffb347';
  return '#ff6b6b';
}

function renderGauge(el, pct, caption) {
  el.innerHTML = '';
  const color = gaugeColor(pct);
  const value = pct === null || pct === undefined ? 0 : pct;
  el.style.background = `conic-gradient(${color} ${value * 3.6}deg, rgba(255,255,255,0.06) 0deg)`;
  const inner = document.createElement('div');
  inner.style.cssText = 'width:48px;height:48px;border-radius:50%;background:#0d1220;display:flex;align-items:center;justify-content:center;';
  const span = document.createElement('span');
  span.className = 'pct';
  span.style.color = color;
  span.textContent = pct === null || pct === undefined ? '–' : Math.round(pct) + '%';
  inner.appendChild(span);
  el.appendChild(inner);
  const cap = document.createElement('div');
  cap.className = 'gcap';
  cap.textContent = caption;
  el.appendChild(cap);
}

async function loadStatus() {
  try {
    const res = await fetch('/api/status');
    if (res.status === 401) { window.location.href = '/login'; return; }
    const data = await res.json();

    document.getElementById('hero-model').textContent = data.model;
    document.getElementById('stat-profile').textContent = data.profile_facts;
    document.getElementById('stat-portfolio').textContent = data.portfolio_count;

    const next = new Date(data.next_briefing);
    document.getElementById('stat-briefing').textContent = next.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
    document.getElementById('stat-briefing-caption').textContent = next.toLocaleDateString('de-DE', { weekday: 'long', day: '2-digit', month: '2-digit' });

    if (data.weather) {
      document.getElementById('weather-value').textContent = Math.round(data.weather.temperature) + '°C';
      document.getElementById('weather-sub').textContent = `${data.weather.city} · ${data.weather.condition}`;
      document.getElementById('weather-dot').classList.remove('off');
    } else {
      document.getElementById('weather-value').textContent = 'Kein Standort';
      document.getElementById('weather-sub').textContent = 'Sag Moni im Chat, wo du wohnst';
      document.getElementById('weather-dot').classList.add('off');
    }

    const sys = data.system || {};
    const cpuPct = sys.load1 !== null && sys.load1 !== undefined ? Math.min(100, sys.load1 * 100) : null;
    renderGauge(document.getElementById('gauge-cpu'), cpuPct, 'CPU');
    renderGauge(document.getElementById('gauge-ram'), sys.mem_used_percent, 'RAM');
    renderGauge(document.getElementById('gauge-disk'), sys.disk_used_percent, 'Speicher');
    document.getElementById('server-dot').classList.toggle('off', cpuPct === null);

    const chipGrid = document.getElementById('tool-chips');
    chipGrid.innerHTML = '';
    for (const name of data.tools) {
      const chip = document.createElement('div');
      chip.className = 'chip';
      chip.textContent = TOOL_LABELS[name] || name;
      chipGrid.appendChild(chip);
    }
  } catch (err) {
    // leave placeholders on failure
  }
}

loadStatus();

/* ---- 3D core ---- */
function initCore() {
  const canvas = document.getElementById('core-canvas');
  const size = 150;
  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(size, size, false);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
  camera.position.z = 4.4;

  const outer = new THREE.Mesh(
    new THREE.IcosahedronGeometry(1.55, 1),
    new THREE.MeshBasicMaterial({ color: 0x00e5ff, wireframe: true, transparent: true, opacity: 0.85 })
  );
  scene.add(outer);

  const inner = new THREE.Mesh(
    new THREE.IcosahedronGeometry(0.95, 0),
    new THREE.MeshBasicMaterial({ color: 0x7c5cff, wireframe: true, transparent: true, opacity: 0.55 })
  );
  scene.add(inner);

  const core = new THREE.Mesh(
    new THREE.SphereGeometry(0.42, 24, 24),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 })
  );
  scene.add(core);

  let frame;
  function animate() {
    frame = requestAnimationFrame(animate);
    outer.rotation.y += 0.0035;
    outer.rotation.x += 0.0012;
    inner.rotation.y -= 0.005;
    inner.rotation.x += 0.0025;
    renderer.render(scene, camera);
  }
  animate();

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) cancelAnimationFrame(frame);
    else animate();
  });
}

if (window.THREE) {
  try { initCore(); } catch (err) { /* canvas keeps its CSS gradient fallback */ }
}

/* ---- Tilt-on-touch for dashboard tiles ---- */
function addTilt(el) {
  function handle(x, y) {
    const rect = el.getBoundingClientRect();
    const px = (x - rect.left) / rect.width - 0.5;
    const py = (y - rect.top) / rect.height - 0.5;
    el.style.transform = `rotateX(${(-py * 6).toFixed(2)}deg) rotateY(${(px * 6).toFixed(2)}deg)`;
    el.style.boxShadow = '0 18px 30px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.08)';
  }
  function reset() {
    el.style.transform = '';
    el.style.boxShadow = '';
  }
  el.addEventListener('mousemove', (e) => handle(e.clientX, e.clientY));
  el.addEventListener('mouseleave', reset);
  el.addEventListener('touchmove', (e) => { const t = e.touches[0]; handle(t.clientX, t.clientY); }, { passive: true });
  el.addEventListener('touchend', reset);
}
document.querySelectorAll('.tile').forEach(addTilt);
</script>
