<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Moni – Login</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0f1115; color: #e8e8ea;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  form {
    width: min(90vw, 340px); display: flex; flex-direction: column; gap: 14px;
    background: #1a1d24; padding: 32px 28px; border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  }
  h1 { margin: 0 0 4px; font-size: 22px; text-align: center; }
  p.sub { margin: 0 0 8px; text-align: center; color: #9098a3; font-size: 14px; }
  input {
    font-size: 16px; padding: 12px 14px; border-radius: 10px; border: 1px solid #2c303a;
    background: #0f1115; color: #e8e8ea;
  }
  input:focus { outline: 2px solid #5b8cff; }
  button {
    font-size: 16px; padding: 12px 14px; border-radius: 10px; border: none;
    background: #5b8cff; color: white; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: 0.6; }
  .error { color: #ff6b6b; font-size: 14px; text-align: center; min-height: 18px; }
</style>
</head>
<body>
<form id="form">
  <h1>Moni</h1>
  <p class="sub">Persönlicher Assistent – bitte anmelden</p>
  <input id="password" type="password" placeholder="Passwort" autocomplete="current-password" autofocus />
  <button type="submit">Anmelden</button>
  <div class="error" id="error"></div>
</form>
<script>
  const form = document.getElementById('form');
  const errorEl = document.getElementById('error');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.textContent = '';
    const password = document.getElementById('password').value;
    const btn = form.querySelector('button');
    btn.disabled = true;
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      });
      const data = await res.json();
      if (data.ok) {
        window.location.href = '/';
      } else {
        errorEl.textContent = data.error || 'Login fehlgeschlagen.';
      }
    } catch (err) {
      errorEl.textContent = 'Verbindungsfehler.';
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
