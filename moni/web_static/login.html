<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Moni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #050710;
    --panel: rgba(15, 20, 35, 0.72);
    --border: rgba(0, 229, 255, 0.25);
    --cyan: #00e5ff;
    --violet: #7c5cff;
    --text: #e6f1ff;
    --muted: #7d8aa8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text); overflow: hidden; position: relative;
    font-family: 'Rajdhani', -apple-system, sans-serif;
  }
  body::before {
    content: ''; position: fixed; inset: 0; z-index: 0;
    background-image:
      linear-gradient(rgba(0,229,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.05) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: radial-gradient(ellipse 70% 70% at 50% 40%, black 20%, transparent 75%);
  }
  .orb {
    position: fixed; top: 50%; left: 50%; width: 520px; height: 520px;
    transform: translate(-50%, -60%); z-index: 0; border-radius: 50%;
    background: radial-gradient(circle, rgba(0,229,255,0.16), rgba(124,92,255,0.08) 45%, transparent 70%);
    filter: blur(10px); animation: pulse 5s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 0.7; } 50% { opacity: 1; } }
  form {
    position: relative; z-index: 1;
    width: min(90vw, 360px); display: flex; flex-direction: column; gap: 16px;
    background: var(--panel); backdrop-filter: blur(16px);
    padding: 36px 30px; border-radius: 20px; border: 1px solid var(--border);
    box-shadow: 0 0 40px rgba(0,229,255,0.08), 0 20px 60px rgba(0,0,0,0.5);
  }
  h1 {
    margin: 0; font-family: 'Orbitron', sans-serif; font-size: 26px; text-align: center;
    letter-spacing: 4px; font-weight: 700;
    background: linear-gradient(90deg, var(--cyan), var(--violet));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p.sub {
    margin: -8px 0 4px; text-align: center; color: var(--muted); font-size: 13px;
    letter-spacing: 2px; text-transform: uppercase;
  }
  input {
    font-size: 16px; padding: 13px 16px; border-radius: 10px; border: 1px solid rgba(0,229,255,0.2);
    background: rgba(5,10,20,0.6); color: var(--text); font-family: inherit;
  }
  input:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(0,229,255,0.15); }
  button {
    font-size: 16px; padding: 13px 16px; border-radius: 10px; border: none;
    background: linear-gradient(90deg, var(--cyan), var(--violet)); color: #05070f; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
  }
  button:disabled { opacity: 0.6; }
  .error { color: #ff6b81; font-size: 14px; text-align: center; min-height: 18px; }
</style>
</head>
<body>
<div class="orb"></div>
<form id="form">
  <h1>MONI</h1>
  <p class="sub">Persönlicher Assistent</p>
  <input id="password" type="password" placeholder="Passwort" autocomplete="current-password" autofocus />
  <button type="submit">Verbinden</button>
  <div class="error" id="error"></div>
</form>
<script>
  const form = document.getElementById('form');
  const errorEl = document.getElementById('error');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.textContent = '';
    const password = document.getElementById('password').value;
    const btn = form.querySelector('button');
    btn.disabled = true;
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      });
      const data = await res.json();
      if (data.ok) {
        window.location.href = '/';
      } else {
        errorEl.textContent = data.error || 'Login fehlgeschlagen.';
      }
    } catch (err) {
      errorEl.textContent = 'Verbindungsfehler.';
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
