services:
  moni:
    build: .
    container_name: moni
    restart: unless-stopped
    env_file: .env
    # Bind-mount des eigenen Git-Checkouts, damit propose_code_change
    # (Selbst-Weiterentwicklung, moni/self_dev.py) auf dem echten
    # Arbeitsverzeichnis branchen/committen kann - passe den Host-Pfad
    # links an dein Setup an, falls er nicht ".".
    # moni_data: persistiert ~/.moni (Portfolio, Gedächtnis, Aufgaben,
    # Ziele, Google-Token, ...) über "docker compose up -d --build" hinweg -
    # ohne dieses Volume startet jeder Rebuild mit leerem Zustand.
    volumes:
      - .:/repo
      - moni_data:/root/.moni
    # Lässt den Container "host.docker.internal" auf die Docker-Host-IP
    # auflösen (Docker Engine 20.10+, Linux). Gebraucht für die
    # Hermes-Agent-Bridge (HERMES_API_URL in .env) - Hermes läuft mit
    # network_mode: host in seinem eigenen Compose-Stack und ist deshalb
    # NICHT über "127.0.0.1" aus diesem Container erreichbar.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Fall B (Reverse-Proxy läuft direkt auf dem Host, nicht containerisiert):
    # bindet nur an localhost des Droplets - dein Host-Caddy/nginx spricht
    # dann mit http://127.0.0.1:8010.
    ports:
      - "127.0.0.1:8010:8010"
    # Fall A (Caddy/nginx läuft selbst als Container, z. B. im gleichen
    # Compose-Stack wie n8n): entferne den ports-Block oben und häng
    # stattdessen dieses Netzwerk an dasselbe externe Netzwerk, in dem auch
    # dein Reverse-Proxy-Container hängt, z. B.:
    # networks:
    #   - proxy-net
    # Der Proxy erreicht Moni dann über den Servicenamen "moni:8010".

volumes:
  moni_data:

